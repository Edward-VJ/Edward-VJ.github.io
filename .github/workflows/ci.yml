name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage
      - run: npm run build
      - run: npx size-limit
      - run: node scripts/check-assets.ts
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: node scripts/build-stats.ts
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  quality:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node scripts/lhci-urls.ts
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir "${{ github.workspace }}/dist" --remap "https://edward-vj.github.io/ file://${{ github.workspace }}/dist/" --accept 200..=204,403,429 --no-progress --verbose './dist/**/*.html'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
      - run: node scripts/check-trailers.ts
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - run: node scripts/hard-rules/index.ts
        env:
          HARD_RULES_DENYLIST: ${{ secrets.HARD_RULES_DENYLIST }}

  ci:
    needs: [build, e2e, quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All gates green?
        run: |
          echo "build=${{ needs.build.result }} e2e=${{ needs.e2e.result }} quality=${{ needs.quality.result }}"
          test "${{ needs.build.result }}" = "success" -a "${{ needs.e2e.result }}" = "success" -a "${{ needs.quality.result }}" = "success"
