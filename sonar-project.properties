sonar.projectKey=edward-vj-github-io
sonar.projectName=edward-vj.github.io
sonar.sources=src,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.spec.ts
sonar.exclusions=dist/**,node_modules/**,.astro/**,.vitest/**,playwright-report/**,test-results/**,coverage/**,src/assets/**,public/**
sonar.coverage.exclusions=src/islands/**,src/pages/**,src/components/**,src/layouts/**,scripts/**,src/config.ts,src/content.config.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
